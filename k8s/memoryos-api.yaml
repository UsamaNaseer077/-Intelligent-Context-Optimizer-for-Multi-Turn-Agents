apiVersion: apps/v1
kind: Deployment
metadata:
  name: memoryos-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: memoryos-api
  template:
    metadata:
      labels:
        app: memoryos-api
    spec:
      containers:
        - name: api
          image: memoryos-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: QDRANT_URL
              value: http://qdrant:6333
            - name: LLM_PROVIDER
              value: deterministic
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: memoryos-api
spec:
  selector:
    app: memoryos-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memoryos-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memoryos-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
